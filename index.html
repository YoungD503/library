<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YO · Young Organize — Free Library</title>
<meta name="description" content="YO · Young Organize. Grab your free library pass and download guides, templates and checklists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#04080a">
<style>
  /* ============ COLORES — edítalos aquí / EDIT YOUR COLORS HERE ============ */
  :root {
    color-scheme: dark;
    --bg: #04080a;
    --panel: rgba(255,255,255,.035);
    --panel-2: rgba(255,255,255,.065);
    --line: rgba(255,255,255,.08);
    --line-2: rgba(255,255,255,.15);
    --text: #e9f5f2;
    --muted: #8b9c9a;
    --green: #2af5a8;        /* verde neón */
    --blue: #3cc8ff;         /* azul eléctrico */
    --ink: #03110c;          /* texto sobre botones con degradado */
    --grad: linear-gradient(110deg, var(--green) 0%, var(--blue) 100%);
    --r: 20px;
    --display: "Sora", system-ui, sans-serif;
    --body: "Manrope", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; background: var(--bg); }
  body { margin: 0; color: var(--text); font: 16px/1.65 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  /* Fondo: cuadrícula que se desvanece + aurora verde/azul */
  body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px; opacity: .6;
    -webkit-mask-image: radial-gradient(ellipse 85% 60% at 50% 0%, #000 25%, transparent 75%);
            mask-image: radial-gradient(ellipse 85% 60% at 50% 0%, #000 25%, transparent 75%); }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 55% 42% at 25% -6%, rgba(42,245,168,.20), transparent 70%),
                radial-gradient(ellipse 55% 42% at 78% -6%, rgba(60,200,255,.20), transparent 70%);
    animation: aurora 14s ease-in-out infinite alternate; }
  @keyframes aurora { to { opacity: .55; } }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.03em; line-height: 1.06; font-weight: 700; }
  em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  button { font: inherit; }
  svg { flex-shrink: 0; }
  ::selection { background: rgba(42,245,168,.3); }

  /* ---------- Nav ---------- */
  nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 0; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .brand-mark { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; position: relative; font: 800 .92rem var(--display); letter-spacing: .04em; color: var(--ink); background: var(--grad); box-shadow: 0 0 26px rgba(42,245,168,.35); }
  .brand-mark::after { content: ""; position: absolute; inset: -5px; border-radius: 16px; border: 1px solid rgba(60,200,255,.35); }
  .brand-name { font: 700 1rem/1 var(--display); letter-spacing: -.01em; }
  .brand-name small { display: block; font: 500 .64rem var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-top: 6px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .lang { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang button { border: 0; background: transparent; color: var(--muted); padding: 6px 11px; border-radius: 999px; font: 600 .72rem var(--mono); letter-spacing: .06em; cursor: pointer; transition: .2s; }
  .lang button:hover { color: var(--text); }
  .lang button.on { background: var(--grad); color: var(--ink); }
  .pass-btn { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-2); color: var(--text); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .86rem; cursor: pointer; transition: .2s; white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .pass-btn:hover { border-color: var(--green); box-shadow: 0 0 22px rgba(42,245,168,.2); }
  .pass-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pass-btn.active .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid transparent; border-radius: 14px; padding: 15px 26px; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; transition: transform .2s, box-shadow .2s, border-color .2s, background .2s; }
  .btn-orange { background: var(--grad); color: var(--ink); box-shadow: 0 10px 34px -10px rgba(42,245,168,.65); }
  .btn-orange:hover { transform: translateY(-2px); box-shadow: 0 16px 44px -10px rgba(60,200,255,.7); }
  .btn-orange:active { transform: translateY(1px); }
  .btn-orange:disabled { opacity: .6; cursor: wait; transform: none; }
  .btn-line { color: var(--text); background: var(--panel); border-color: var(--line-2); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .btn-line:hover { border-color: var(--blue); box-shadow: 0 0 26px rgba(60,200,255,.18); }
  .btn svg { transition: transform .2s; }
  .btn:hover svg.arrow { transform: translateX(4px); }

  /* ---------- Hero ---------- */
  .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; padding: 48px 0 84px; }
  .live { display: inline-flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--green); font: 500 .72rem var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 7px 14px 7px 11px; border-radius: 999px; margin-bottom: 28px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); position: relative; }
  .live i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--green); animation: ping 1.8s infinite; }
  @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(2); opacity: 0; } }
  .hero h1 { font-size: clamp(2.5rem, 6.2vw, 4.9rem); }
  .hero h1 em { position: relative; white-space: nowrap; }
  .squiggle { position: absolute; left: 0; bottom: -.12em; width: 100%; height: .24em; filter: drop-shadow(0 0 6px rgba(60,200,255,.9)); }
  .squiggle path { stroke: var(--blue); stroke-width: 3; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.4s .4s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .hero p.lead { font-size: 1.15rem; color: var(--muted); max-width: 46ch; margin: 26px 0 34px; }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .mini-stats { display: inline-flex; margin-top: 44px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); max-width: 100%; }
  .mini-stats div { padding: 14px 24px; }
  .mini-stats div + div { border-left: 1px solid var(--line); }
  .mini-stats strong { display: block; font: 700 1.7rem/1.1 var(--display); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mini-stats span { font: 500 .64rem var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

  /* Hero visual: orbe + anillos en órbita + tarjetas de vidrio flotando */
  .stack { position: relative; height: 480px; perspective: 1200px; }
  .stack::before, .stack::after { content: ""; position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; }
  .stack::before { width: 440px; height: 440px; margin: -220px 0 0 -220px; border: 1px dashed rgba(60,200,255,.28); animation: spin 50s linear infinite; }
  .stack::after { width: 310px; height: 310px; margin: -155px 0 0 -155px; border: 1px solid rgba(42,245,168,.18); }
  .stack .blob { position: absolute; left: 50%; top: 50%; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(42,245,168,.55), rgba(60,200,255,.32) 45%, transparent 70%); filter: blur(34px); animation: pulse 8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.14); opacity: .75; } }
  .stack .book-mini { position: absolute; width: 210px; height: 280px; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; color: var(--text);
    background: linear-gradient(160deg, rgba(255,255,255,.11), rgba(255,255,255,.02)); border: 1px solid var(--line-2);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 30px 60px -20px rgba(0,0,0,.75);
    transition: transform .6s cubic-bezier(.2,.8,.2,1); animation: float 7s ease-in-out infinite; }
  .stack .book-mini::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--grad); }
  .stack .book-mini::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 100% 0%, var(--glow), transparent 60%); pointer-events: none; }
  .stack .book-mini h3 { font-size: 1.4rem; position: relative; z-index: 1; }
  .stack .book-mini small { font: 500 .64rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); position: relative; z-index: 1; }
  .stack .b1 { left: 4%; top: 120px; transform: rotateY(20deg) rotateZ(-6deg); }
  .stack .b2 { left: 30%; top: 56px; z-index: 2; transform: rotateY(-4deg); animation-delay: -2.3s; }
  .stack .b3 { left: 56%; top: 136px; transform: rotateY(-22deg) rotateZ(5deg); animation-delay: -4.6s; }
  .stack:hover .b1 { transform: rotateY(26deg) rotateZ(-9deg) translateX(-18px); }
  .stack:hover .b2 { transform: rotateY(0) translateY(-12px); }
  .stack:hover .b3 { transform: rotateY(-28deg) rotateZ(8deg) translateX(18px); }
  @keyframes float { 50% { translate: 0 -12px; } }
  .sticker { position: absolute; right: 0; top: 0; width: 118px; height: 118px; z-index: 3; animation: spin 20s linear infinite; }
  .sticker circle { fill: rgba(4,8,10,.75); stroke: rgba(60,200,255,.4); stroke-width: 1; }
  .sticker text { fill: var(--green); font-family: "JetBrains Mono", monospace; font-weight: 500; }
  .sticker-core { position: absolute; right: 34px; top: 34px; width: 50px; height: 50px; z-index: 4; background: var(--grad); border-radius: 50%; display: grid; place-items: center; color: var(--ink); font: 800 .88rem var(--display); box-shadow: 0 0 30px rgba(42,245,168,.55); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Marquee ---------- */
  .marquee { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); padding: 16px 0; overflow: hidden; }
  .marquee-track { display: flex; gap: 48px; width: max-content; animation: scroll 45s linear infinite; font: 500 .82rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .marquee-track span { display: flex; align-items: center; gap: 48px; }
  .marquee-track span::after { content: "◆"; font-size: .55rem; color: var(--green); text-shadow: 0 0 8px var(--green); }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* ---------- Steps ---------- */
  .section { padding: 110px 0 30px; }
  .section-title { font-size: clamp(2rem, 4.6vw, 3.3rem); max-width: 18ch; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 44px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; position: relative; overflow: hidden; transition: transform .3s, border-color .3s, background .3s; }
  .step::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--grad); opacity: 0; transition: opacity .3s; }
  .step:hover { transform: translateY(-4px); border-color: var(--line-2); background: var(--panel-2); }
  .step:hover::after { opacity: 1; }
  .step .num { display: inline-block; font: 500 .74rem var(--mono); letter-spacing: .12em; color: var(--green); padding: 4px 10px; border: 1px solid rgba(42,245,168,.3); border-radius: 999px; margin-bottom: 44px; }
  .step h3 { font-size: 1.3rem; margin-bottom: 8px; }
  .step p { margin: 0; color: var(--muted); }

  /* ---------- Library ---------- */
  .lib-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 0 14px; color: var(--muted); transition: .2s; }
  .search:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgba(42,245,168,.12); }
  .search input { border: 0; outline: 0; background: transparent; padding: 11px 0; font: inherit; color: var(--text); width: 170px; }
  .search input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line-2); background: var(--panel); color: var(--muted); padding: 8px 15px; border-radius: 12px; font-weight: 600; font-size: .86rem; cursor: pointer; transition: .2s; }
  .chip:hover { color: var(--text); border-color: var(--blue); }
  .chip.active { background: var(--grad); border-color: transparent; color: var(--ink); }

  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 28px 20px; }
  .book { display: flex; flex-direction: column; animation: rise .5s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .cover { position: relative; aspect-ratio: 4 / 4.6; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; color: var(--text);
    background: radial-gradient(circle at 100% 0%, var(--glow), transparent 58%), linear-gradient(160deg, #0d1a1d, #060c0e);
    border: 1px solid var(--line); transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s; }
  .cover::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }
  .cover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 24px 24px;
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 75%); mask-image: linear-gradient(to bottom, #000, transparent 75%); }
  .book:hover .cover, .cover:focus-visible { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 24px 50px -24px var(--glow); outline: 0; }
  .cover .top { display: flex; justify-content: space-between; align-items: center; font: 500 .64rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); position: relative; z-index: 1; }
  .cover .type { border: 1px solid currentColor; padding: 2px 9px; border-radius: 999px; }
  .cover h3 { font-size: 1.7rem; margin-top: auto; position: relative; z-index: 1; max-width: 11ch; }
  .cover .no { font: 500 .72rem var(--mono); color: var(--muted); letter-spacing: .12em; margin-top: 10px; position: relative; z-index: 1; }
  .lock { position: absolute; right: 16px; bottom: 16px; z-index: 2; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--line-2); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--accent); display: grid; place-items: center; transition: transform .3s; }
  .book:hover .lock { transform: rotate(-10deg) scale(1.06); }
  .unlocking .lock { animation: pop-off .7s cubic-bezier(.5,-.5,.6,1.4) forwards; animation-delay: var(--d); }
  @keyframes pop-off { 30% { transform: scale(1.3) rotate(-15deg); } 100% { transform: scale(0) rotate(40deg); opacity: 0; } }

  /* Colores de portada: 0 = verde, 1 = azul, 2 = turquesa, 3 = índigo */
  .c0 { --accent: var(--green); --glow: rgba(42,245,168,.42); }
  .c1 { --accent: var(--blue); --glow: rgba(60,200,255,.42); }
  .c2 { --accent: #2de0d0; --glow: rgba(45,224,208,.38); }
  .c3 { --accent: #8b9dff; --glow: rgba(99,120,255,.42); }

  .info { padding: 16px 4px 0; display: flex; flex-direction: column; flex: 1; }
  .info p { margin: 0 0 14px; color: var(--muted); font-size: .95rem; flex: 1; }
  .info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .meta { font: 500 .7rem var(--mono); color: var(--muted); letter-spacing: .04em; }
  .dl { display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; cursor: pointer; padding: 9px 15px; border-radius: 10px; font-weight: 700; font-size: .85rem; transition: .2s; background: var(--grad); color: var(--ink); }
  .dl:hover { box-shadow: 0 0 24px rgba(42,245,168,.4); }
  .dl.locked { background: var(--panel); border-color: var(--line-2); color: var(--text); }
  .dl.locked:hover { border-color: var(--green); color: var(--green); box-shadow: none; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px; }

  /* ---------- Reviews ---------- */
  .rv-summary { display: flex; align-items: center; gap: 14px; }
  .rv-avg { font: 700 3rem/1 var(--display); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stars { color: var(--green); letter-spacing: 2px; font-size: 1rem; white-space: nowrap; text-shadow: 0 0 10px rgba(42,245,168,.5); }
  .stars .off { color: rgba(255,255,255,.14); text-shadow: none; }
  .rv-summary small { display: block; font: 500 .7rem var(--mono); color: var(--muted); letter-spacing: .06em; margin-top: 2px; }
  .rv-grid { columns: 3 270px; column-gap: 18px; }
  .rv { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; margin: 0 0 18px; position: relative; animation: rise .5s both; transition: border-color .3s; }
  .rv:hover { border-color: var(--line-2); }
  .rv:nth-child(3n+2) { background: linear-gradient(160deg, rgba(42,245,168,.07), rgba(255,255,255,.02)); }
  .rv:nth-child(3n) { background: linear-gradient(160deg, rgba(60,200,255,.07), rgba(255,255,255,.02)); }
  .rv::before { content: "“"; position: absolute; top: 10px; right: 20px; font: 700 3.6rem/1 var(--display); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: .35; }
  .rv-text { margin: 12px 0 18px; color: var(--text); white-space: pre-line; overflow-wrap: anywhere; }
  .rv-foot { display: flex; align-items: center; gap: 10px; }
  .rv-avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--grad); color: var(--ink); display: grid; place-items: center; font: 800 .9rem var(--display); flex-shrink: 0; }
  .rv:nth-child(3n+2) .rv-avatar { background: linear-gradient(110deg, var(--blue), var(--green)); }
  .rv-foot strong { display: block; font-size: .92rem; line-height: 1.2; }
  .rv-foot small { font: 500 .68rem var(--mono); color: var(--muted); letter-spacing: .03em; }
  .rv-empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 44px 24px; text-align: center; color: var(--muted); column-span: all; background: var(--panel); }
  .rv-empty b { display: block; font-size: 1.8rem; margin-bottom: 6px; letter-spacing: 6px; color: var(--green); text-shadow: 0 0 14px rgba(42,245,168,.5); }
  .rv-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .meta .rate { color: var(--green); font-weight: 600; }

  .rv-card { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; position: relative; border-radius: 24px; padding: 30px 32px;
    background: linear-gradient(160deg, #0e1a1e, #060c0e); border: 1px solid var(--line-2);
    box-shadow: 0 40px 100px -20px rgba(0,0,0,.85), 0 0 70px -24px rgba(42,245,168,.35); animation: drop .5s cubic-bezier(.2,1.2,.3,1); }
  .rv-card::before { content: ""; position: absolute; left: 24px; right: 24px; top: 0; height: 2px; background: var(--grad); border-radius: 2px; }
  .rv-card .ticket-top { margin: -10px -12px 10px 0; }
  .rv-badge { font: 600 .72rem var(--mono); color: var(--green); letter-spacing: .12em; }
  .rv-card h2 { font-size: 1.8rem; }
  .rv-card .sub { color: var(--muted); margin: 8px 0 20px; }
  .rv-card .btn { width: 100%; }
  .stars-input { display: inline-flex; flex-direction: row-reverse; gap: 4px; }
  .field .stars-input input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .stars-input label { font-size: 2.2rem; line-height: 1; color: rgba(255,255,255,.14); cursor: pointer; transition: transform .15s, color .15s, text-shadow .15s; }
  .stars-input label:hover { transform: scale(1.15); }
  .stars-input input:checked ~ label, .stars-input label:hover, .stars-input label:hover ~ label { color: var(--green); text-shadow: 0 0 14px rgba(42,245,168,.6); }
  .stars-input input:focus-visible + label { outline: 1px solid var(--blue); border-radius: 6px; }
  .field select, .field textarea { width: 100%; padding: 13px 15px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(255,255,255,.04); color: var(--text); font: 1rem var(--body); transition: .2s; }
  .field select option { background: #0b1418; color: var(--text); }
  .field textarea { resize: vertical; min-height: 110px; }
  .field textarea::placeholder { color: rgba(233,245,242,.35); }
  .field select:focus, .field textarea:focus { outline: 0; border-color: var(--green); background: rgba(255,255,255,.06); box-shadow: 0 0 0 3px rgba(42,245,168,.14); }

const STORAGE_KEY = "library_user";
const LANG_KEY = "library_lang";
const $ = (id) => document.getElementById(id);

const safe = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let user = null;
try { user = JSON.parse(safe.get(STORAGE_KEY)); } catch {}
if (user && !user.pass) { user.pass = String(Math.floor(1000 + Math.random() * 9000)); safe.set(STORAGE_KEY, JSON.stringify(user)); }

let lang = safe.get(LANG_KEY) || ((navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en");
if (!I18N[lang]) lang = "en";

/* ---------- Tracking (anonymous visitor ID + where people come from) ---------- */
const VISITOR_KEY = "library_vid";
const SOURCE_KEY = "library_src";
const isReturning = !!safe.get(VISITOR_KEY);
const visitorId = safe.get(VISITOR_KEY) || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
safe.set(VISITOR_KEY, visitorId);

function deviceInfo() {
  const ua = navigator.userAgent;
  const iPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  const device = iPadOS || /iPad|Tablet|Android(?!.*Mobile)/i.test(ua) ? "Tablet" : /Mobi|iPhone|iPod|Android/i.test(ua) ? "Mobile" : "Desktop";
  const browser = /Edg\//.test(ua) ? "Edge" : /OPR\/|Opera/.test(ua) ? "Opera" : /SamsungBrowser/.test(ua) ? "Samsung Internet"
    : /Instagram/.test(ua) ? "Instagram app" : /FBAN|FBAV/.test(ua) ? "Facebook app" : /TikTok|musical_ly/i.test(ua) ? "TikTok app"
    : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Other";
  const os = /Windows/.test(ua) ? "Windows" : (iPadOS || /iPhone|iPad|iPod/.test(ua)) ? "iOS" : /Android/.test(ua) ? "Android"
    : /CrOS/.test(ua) ? "ChromeOS" : /Mac OS X/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "Other";
  return { device, browser, os };
}

/* Remembers where the visitor first came from (UTM link, other website, or direct) */
function trafficSource() {
  let src = null;
  try { src = JSON.parse(safe.get(SOURCE_KEY)); } catch {}
  const u = new URLSearchParams(location.search);
  if (!src || u.get("utm_source")) {
    let ref = "";
    try { ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, "") : ""; } catch {}
    if (ref && ref === location.hostname.replace(/^www\./, "")) ref = "";
    src = {
      source: u.get("utm_source") || ref || "direct",
      medium: u.get("utm_medium") || (ref ? "referral" : "none"),
      campaign: u.get("utm_campaign") || "",
      referrer: document.referrer || "",
      landing: location.href
    };
    safe.set(SOURCE_KEY, JSON.stringify(src));
  }
  return src;
}

function ctx() {
  const d = deviceInfo(), s = trafficSource();
  let region = "", timezone = "";
  try { region = new Intl.Locale(navigator.language).region || ""; } catch {}
  try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch {}
  return {
    visitorId, lang, device: d.device, browser: d.browser, os: d.os, timezone, region,
    source: s.source, medium: s.medium, campaign: s.campaign, referrer: s.referrer, landing: s.landing,
    screen: `${screen.width}x${screen.height}`, page: location.href
  };
}

function trackVisit() {
  if (SCRIPT_URL.startsWith("PASTE")) return;
  try { if (sessionStorage.getItem("library_visit")) return; sessionStorage.setItem("library_visit", "1"); } catch {}
  send({ action: "visit", returning: isReturning ? "yes" : "no", signedUp: user ? "yes" : "no", ...ctx() });
}

  for (let i = 1; i <= 5; i++) s += `<span class="${i <= Math.round(n) ? "" : "off"}">★</span>`;
  return `<span class="stars" role="img" aria-label="${esc(t("starsLabel", { n: Math.round(n * 10) / 10 }))}">${s}</span>`;
}

/* Average rating per guide, e.g. { "starter-guide": "4.8" } */
function guideRatings() {
  const sums = {};
  reviews.forEach(r => { if (!r.guideId) return; (sums[r.guideId] ||= []).push(Number(r.rating) || 0); });
  const out = {};
  Object.keys(sums).forEach(id => { const a = sums[id]; out[id] = (a.reduce((x, y) => x + y, 0) / a.length).toFixed(1); });
  return out;
}

function renderReviews() {
  const n = reviews.length;
  if (!n) {
    $("rvSummary").innerHTML = "";
    $("rvGrid").innerHTML = `<div class="rv-empty"><b>★★★★★</b>${esc(t("rvEmpty"))}</div>`;
    $("rvMore").style.display = "none";
    return;
  }
  const avg = reviews.reduce((a, r) => a + (Number(r.rating) || 0), 0) / n;
  $("rvSummary").innerHTML = `<span class="rv-avg">${avg.toFixed(1)}</span><div>${starsHTML(avg)}<small>${esc(n === 1 ? t("rvCount1") : t("rvCount", { n }))}</small></div>`;
  let fmt = null;
  try { fmt = new Intl.DateTimeFormat(lang, { month: "short", year: "numeric" }); } catch {}
  const list = showAllReviews ? reviews : reviews.slice(0, 6);
  $("rvGrid").innerHTML = list.map((r, k) => {
    const g = GUIDES.find(x => x.id === r.guideId);
    const about = g ? gTitle(g) : (r.guideTitle || t("rvWhole"));
    const name = String(r.name || "").trim() || t("rvAnon");
    let date = "";
    try { date = fmt ? fmt.format(new Date(r.date)) : ""; } catch {}
    return `<article class="rv" style="animation-delay:${k * 60}ms">
      ${starsHTML(Number(r.rating) || 0)}
      <p class="rv-text">${esc(r.text)}</p>
      <div class="rv-foot"><span class="rv-avatar">${esc(name.charAt(0).toUpperCase())}</span>
        <div><strong>${esc(name)}</strong><small>${esc(about)}${date ? " · " + esc(date) : ""}</small></div></div>
    </article>`;
  }).join("");
  $("rvMore").style.display = n > 6 && !showAllReviews ? "" : "none";
}

async function loadReviews() {
  if (!SCRIPT_URL.startsWith("PASTE")) {
    try {
      const res = await fetch(SCRIPT_URL + "?action=reviews");
      const data = await res.json();
      if (data && data.ok && Array.isArray(data.reviews)) reviews = data.reviews;
    } catch {}
  }
  renderReviews(); renderShelf();
}

function fillGuideSelect() {
  const sel = $("rvGuide"), current = sel.value;
  sel.innerHTML = `<option value="">${esc(t("rvWhole"))}</option>` +
    GUIDES.map(g => `<option value="${esc(g.id)}">${esc(gTitle(g))}</option>`).join("");
  sel.value = current;
}

function openReview(guideId) {
  if (!user) return openModal(null, "review");
  $("rvCard").classList.remove("done");
  $("rvError").textContent = "";
  fillGuideSelect();
  if (guideId) $("rvGuide").value = guideId;
  if (!$("rvName").value) {
    const parts = user.name.trim().split(/\s+/);
    $("rvName").value = parts[0] + (parts[1] ? " " + parts[1].charAt(0).toUpperCase() + "." : "");
  }
  $("rvOverlay").classList.add("open");
  $("rvCard").scrollTop = 0;
  syncScrollLock();
}
function closeReview() { $("rvOverlay").classList.remove("open"); syncScrollLock(); }

/* Stops the page behind a window from scrolling while it's open */
function syncScrollLock() {
  document.documentElement.classList.toggle("modal-open", !!document.querySelector(".overlay.open"));
}
/* Only auto-focus on devices with a mouse, so phones don't pop the keyboard up unexpectedly */
const finePointer = () => { try { return matchMedia("(pointer: fine)").matches; } catch { return true; } };

function renderAll() {
  applyStatic(); renderNav(); renderStack(); renderMarquee(); renderChips(); renderShelf(); renderModalText();
  renderReviews(); fillGuideSelect();
}

function setLang(l) {
  if (!I18N[l] || l === lang) return;
  lang = l; safe.set(LANG_KEY, l);
  $("formError").textContent = "";
  renderAll();
}

function countUp(el, to) {
  let n = 0; const step = Math.max(1, Math.ceil(to / 20));
  const timer = setInterval(() => { n = Math.min(to, n + step); el.textContent = n; if (n >= to) clearInterval(timer); }, 40);
}

/* ---------- Modal ---------- */
function openModal(guide, action) {
  if (user) return;
  pendingGuide = guide || null;
  pendingAction = action || null;
  $("ticket").classList.remove("done");
  $("formError").textContent = "";
  renderModalText();
  $("overlay").classList.add("open");
  syncScrollLock();
  $("ticket").scrollTop = 0;
  if (finePointer()) setTimeout(() => $("name").focus({ preventScroll: true }), 80);
}
function closeModal() { $("overlay").classList.remove("open"); syncScrollLock(); }

function confetti() {
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#2af5a8", "#3cc8ff", "#2de0d0", "#8b9dff", "#e9f5f2"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length]; p.style.color = colors[i % colors.length];
    p.style.setProperty("--x", (Math.random() * 200 - 100) + "px");
    p.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
    p.style.setProperty("--t", (1.6 + Math.random() * 1.6) + "s");
    p.style.animationDelay = Math.random() * .4 + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4000);
}

function unlockShelf() {
  $("shelf").classList.add("unlocking");
  setTimeout(() => { $("shelf").classList.remove("unlocking"); renderShelf(); }, 900);
}

function download(g) {
  const file = gFile(g);
  if (!SCRIPT_URL.startsWith("PASTE")) send({ action: "download", email: user.email, name: user.name, guideId: g.id, guideTitle: g.title, ...ctx() });
  const a = document.createElement("a");
  a.href = file; a.target = "_blank"; a.rel = "noopener";
  if (!/^https?:/i.test(file)) a.download = "";
  document.body.appendChild(a); a.click(); a.remove();
  toast(ICON.dl + esc(t("downloading", { title: gTitle(g) })));
}

$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const email = f.email.value.trim().toLowerCase();
  if (f.website.value) return;
  if (name.length < 2) return ($("formError").textContent = t("errName"));
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return ($("formError").textContent = t("errEmail"));
  if (SCRIPT_URL.startsWith("PASTE")) return ($("formError").textContent = t("errSetup"));

  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = t("submitting");
  try {
    const role = (f.querySelector("input[name=role]:checked") || {}).value || "";
    await send({
      action: "signup", name, email, role, consent: f.consent.checked ? "yes" : "no",
      guideId: pendingGuide ? pendingGuide.id : "", guideTitle: pendingGuide ? pendingGuide.title : "",
      userAgent: navigator.userAgent, ...ctx()
    });
    user = { name, email, pass: String(Math.floor(1000 + Math.random() * 9000)) };
    safe.set(STORAGE_KEY, JSON.stringify(user));
    renderModalText();
    $("ticket").classList.add("done");
    $("ticket").scrollTop = 0;
    renderNav(); confetti(); unlockShelf(); f.reset();
  } catch {
    $("formError").textContent = t("errNet");
  } finally {
    btn.disabled = false; btn.textContent = t("submit");
  }
});

/* ---------- Events ---------- */
function handleGuide(id) {
  const g = GUIDES.find(x => x.id === id); if (!g) return;
  user ? download(g) : openModal(g);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("shelf").addEventListener("click", (e) => {
  const el = e.target.closest("[data-id]"); if (el) handleGuide(el.dataset.id);
});
$("shelf").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".cover")) { e.preventDefault(); handleGuide(e.target.dataset.id); }
});
$("chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  activeCat = c.dataset.cat; renderChips(); renderShelf();
});
$("search").addEventListener("input", (e) => { query = e.target.value.trim(); renderShelf(); });
const goOrOpen = () => user ? $("library").scrollIntoView({ behavior: "smooth" }) : openModal();
$("heroCta").addEventListener("click", goOrOpen);
$("ctaBtn").addEventListener("click", goOrOpen);
$("passBtn").addEventListener("click", () => {
  if (!user) return openModal();
  if (confirm(t("signOut"))) { safe.del(STORAGE_KEY); user = null; renderNav(); renderShelf(); }
});
$("successDownload").addEventListener("click", () => {
  closeModal();
  if (pendingAction === "review") return openReview();
  if (pendingGuide) download(pendingGuide);
});

/* Review events */
$("rvOpen").addEventListener("click", () => openReview());
$("rvMore").addEventListener("click", () => { showAllReviews = true; renderReviews(); });
$("rvClose").addEventListener("click", closeReview);
$("rvDoneBtn").addEventListener("click", closeReview);
$("rvOverlay").addEventListener("click", (e) => { if (e.target.id === "rvOverlay") closeReview(); });
$("rvText").addEventListener("input", (e) => { $("rvCount").textContent = e.target.value.length; });
$("rvForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const err = (m) => { $("rvError").textContent = m; };
  if (f.website.value) return;
  const rating = (f.querySelector("input[name=rating]:checked") || {}).value;
  const text = $("rvText").value.trim();
  if (!rating) return err(t("rvErrRating"));
  if (text.length < 5) return err(t("rvErrText"));
  if (!f.agree.checked) return err(t("rvErrConsent"));
  if (SCRIPT_URL.startsWith("PASTE")) return err(t("errSetup"));

  const btn = $("rvSubmit"); btn.disabled = true; btn.textContent = t("rvSending");
  try {
    const gid = $("rvGuide").value;
    const g = GUIDES.find(x => x.id === gid);
    await send({
      action: "review", email: user.email, name: $("rvName").value.trim() || firstName(),
      rating, text, guideId: gid, guideTitle: g ? g.title : "", ...ctx()
    });
    $("rvCard").classList.add("done");
    $("rvCard").scrollTop = 0;
    f.reset(); $("rvCount").textContent = "0";
    confetti();
  } catch {
    err(t("errNet"));
  } finally {
    btn.disabled = false; btn.textContent = t("rvSubmit");
  }
});
$("successBrowse").addEventListener("click", () => { closeModal(); $("library").scrollIntoView({ behavior: "smooth" }); });
$("closeModal").addEventListener("click", closeModal);
$("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeReview(); } });

/* ---------- Init ---------- */
$("year").textContent = new Date().getFullYear();
renderAll();
countUp($("statCount"), GUIDES.length);
countUp($("statCats"), new Set(GUIDES.map(g => g.category)).size);
trackVisit();
loadReviews();
if (!user && AUTO_OPEN_DELAY >= 0) setTimeout(() => openModal(), AUTO_OPEN_DELAY);
</script>
</body>
</html>
