<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YO · Young Organize — Free Library</title>
<meta name="description" content="YO · Young Organize. Grab your free library pass and download guides, templates and checklists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ EDIT YOUR COLORS HERE ============ */
  :root {
    color-scheme: light;
    --paper: #fffdf7;        /* warm white */
    --white: #ffffff;
    --forest: #0f4d32;       /* deep green */
    --green: #1f9d55;        /* fresh green */
    --mint: #dcf5e6;         /* light green */
    --orange: #ff6a1a;       /* bright orange */
    --peach: #ffe6d3;        /* light orange */
    --ink: #10231a;
    --muted: #5d6e64;
    --line: #e4ece6;
    --r: 22px;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --body: "DM Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.02em; line-height: 1.02; }
  em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
  button { font: inherit; }
  svg { flex-shrink: 0; }

  /* ---------- Nav ---------- */
  nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 0; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--forest); }
  .brand-mark { width: 42px; height: 42px; border-radius: 12px; background: var(--forest); color: var(--white); display: grid; place-items: center; position: relative; font: 800 1rem var(--display); letter-spacing: .02em; }
  .brand-mark::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); position: absolute; right: -4px; top: -4px; border: 3px solid var(--paper); }
  .brand-name { font: 800 1rem/1 var(--display); letter-spacing: -.01em; }
  .brand-name small { display: block; font: 500 .72rem var(--body); color: var(--muted); letter-spacing: .04em; margin-top: 3px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .lang { display: flex; background: var(--mint); border-radius: 999px; padding: 3px; }
  .lang button { border: 0; background: transparent; color: var(--forest); padding: 6px 11px; border-radius: 999px; font-weight: 700; font-size: .78rem; cursor: pointer; transition: .2s; }
  .lang button.on { background: var(--forest); color: var(--white); }
  .pass-btn { display: flex; align-items: center; gap: 8px; background: var(--white); border: 1.5px solid var(--forest); color: var(--forest); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; cursor: pointer; transition: .2s; white-space: nowrap; }
  .pass-btn:hover { background: var(--forest); color: var(--white); }
  .pass-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pass-btn.active .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(31,157,85,.2); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; padding: 16px 28px; font-weight: 600; font-size: 1.02rem; cursor: pointer; text-decoration: none; transition: transform .2s, box-shadow .2s, background .2s; }
  .btn-orange { background: var(--orange); color: var(--white); box-shadow: 0 6px 0 #c94a07; }
  .btn-orange:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c94a07; }
  .btn-orange:active { transform: translateY(4px); box-shadow: 0 2px 0 #c94a07; }
  .btn-line { color: var(--forest); background: transparent; border: 1.5px solid var(--forest); }
  .btn-line:hover { background: var(--mint); }
  .btn svg { transition: transform .2s; }
  .btn:hover svg.arrow { transform: translateX(4px); }

  /* ---------- Hero ---------- */
  .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; padding: 40px 0 70px; }
  .live { display: inline-flex; align-items: center; gap: 10px; background: var(--mint); color: var(--forest); font-weight: 600; font-size: .85rem; padding: 7px 14px 7px 10px; border-radius: 999px; margin-bottom: 26px; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); position: relative; }
  .live i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--green); animation: ping 1.8s infinite; }
  @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  .hero h1 { font-size: clamp(2.6rem, 6.6vw, 5.2rem); font-weight: 800; color: var(--forest); }
  .hero h1 em { color: var(--orange); font-size: 1.08em; position: relative; white-space: nowrap; }
  .squiggle { position: absolute; left: 0; bottom: -.12em; width: 100%; height: .3em; }
  .squiggle path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s .4s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .hero p.lead { font-size: 1.2rem; color: var(--muted); max-width: 46ch; margin: 26px 0 34px; }
  .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .mini-stats { display: flex; gap: 30px; margin-top: 40px; flex-wrap: wrap; }
  .mini-stats strong { display: block; font: 800 2rem var(--display); color: var(--forest); line-height: 1; }
  .mini-stats span { font-size: .85rem; color: var(--muted); }

  /* Fanned book stack */
  .stack { position: relative; height: 470px; }
  .stack .blob { position: absolute; inset: 30px 10px 10px 40px; background: var(--mint); border-radius: 46% 54% 42% 58% / 52% 40% 60% 48%; animation: morph 12s ease-in-out infinite; }
  @keyframes morph { 50% { border-radius: 58% 42% 55% 45% / 42% 58% 42% 58%; } }
  .stack .book-mini { position: absolute; width: 230px; height: 310px; border-radius: 8px 18px 18px 8px; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: -8px 0 0 rgba(0,0,0,.08) inset, 0 24px 50px rgba(15,77,50,.22); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .stack .book-mini h3 { font-size: 1.6rem; }
  .stack .book-mini small { font-weight: 600; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  .stack .b1 { left: 8%; top: 70px; transform: rotate(-12deg); }
  .stack .b2 { left: 30%; top: 30px; transform: rotate(3deg); z-index: 2; }
  .stack .b3 { left: 50%; top: 110px; transform: rotate(14deg); }
  .stack:hover .b1 { transform: rotate(-18deg) translate(-20px, 6px); }
  .stack:hover .b2 { transform: rotate(0) translateY(-14px); }
  .stack:hover .b3 { transform: rotate(20deg) translate(20px, 6px); }
  .sticker { position: absolute; right: 2%; top: 0; width: 120px; height: 120px; z-index: 3; animation: spin 14s linear infinite; }
  .sticker-core { position: absolute; right: calc(2% + 35px); top: 35px; width: 50px; height: 50px; z-index: 4; background: var(--orange); border-radius: 50%; display: grid; place-items: center; color: var(--white); font: 800 .95rem var(--display); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Marquee ---------- */
  .marquee { background: var(--forest); color: var(--white); padding: 18px 0; overflow: hidden; transform: rotate(-1.2deg); margin: 0 -20px; }
  .marquee-track { display: flex; gap: 40px; width: max-content; animation: scroll 30s linear infinite; font: 700 1.3rem var(--display); white-space: nowrap; }
  .marquee-track span { display: flex; align-items: center; gap: 40px; }
  .marquee-track span::after { content: "✦"; color: var(--orange); }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* ---------- Steps ---------- */
  .section { padding: 100px 0 40px; }
  .section-title { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 800; color: var(--forest); max-width: 16ch; }
  .section-title em { color: var(--orange); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 44px; }
  .step { background: var(--white); border: 1.5px solid var(--line); border-radius: var(--r); padding: 28px; position: relative; overflow: hidden; transition: transform .25s, border-color .25s; }
  .step:hover { transform: translateY(-4px); border-color: var(--green); }
  .step .num { font: 800 4.5rem var(--display); color: var(--mint); line-height: .9; display: block; margin-bottom: 18px; transition: color .25s; }
  .step:hover .num { color: var(--orange); }
  .step h3 { font-size: 1.35rem; margin-bottom: 8px; color: var(--forest); }
  .step p { margin: 0; color: var(--muted); }

  /* ---------- Library ---------- */
  .lib-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--white); border: 1.5px solid var(--line); border-radius: 999px; padding: 0 16px; color: var(--muted); }
  .search:focus-within { border-color: var(--green); }
  .search input { border: 0; outline: 0; background: transparent; padding: 11px 0; font: inherit; color: var(--ink); width: 170px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background: var(--white); color: var(--ink); padding: 9px 16px; border-radius: 999px; font-weight: 500; font-size: .9rem; cursor: pointer; transition: .2s; }
  .chip:hover { border-color: var(--forest); }
  .chip.active { background: var(--forest); border-color: var(--forest); color: var(--white); }

  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 28px 22px; }
  .book { display: flex; flex-direction: column; animation: rise .5s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .cover { position: relative; aspect-ratio: 4 / 4.6; border-radius: 6px 20px 20px 6px; padding: 22px 22px 20px 30px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; box-shadow: 0 10px 24px rgba(15,77,50,.12); }
  .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: rgba(0,0,0,.12); }
  .cover::after { content: ""; position: absolute; inset: 0; background-image: var(--pat); opacity: .14; pointer-events: none; }
  .book:hover .cover { transform: translateY(-6px) rotate(-1.5deg); box-shadow: 0 22px 40px rgba(15,77,50,.2); }
  .cover .top { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; position: relative; z-index: 1; }
  .cover .type { border: 1.5px solid currentColor; padding: 2px 9px; border-radius: 999px; }
  .cover h3 { font-size: 1.85rem; font-weight: 800; margin-top: auto; position: relative; z-index: 1; max-width: 11ch; }
  .cover .no { font-family: var(--serif); font-style: italic; font-size: 1.1rem; opacity: .8; margin-top: 10px; position: relative; z-index: 1; }
  .lock { position: absolute; right: 16px; bottom: 16px; z-index: 2; width: 46px; height: 46px; border-radius: 50%; background: var(--white); color: var(--forest); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.18); transition: transform .3s; }
  .book:hover .lock { transform: rotate(-12deg) scale(1.08); }
  .unlocking .lock { animation: pop-off .7s cubic-bezier(.5,-.5,.6,1.4) forwards; animation-delay: var(--d); }
  @keyframes pop-off { 30% { transform: scale(1.3) rotate(-15deg); } 100% { transform: scale(0) rotate(40deg); opacity: 0; } }

  .c0 { background: var(--forest); color: var(--white); --pat: radial-gradient(circle, #fff 1.5px, transparent 2px); }
  .c1 { background: var(--orange); color: var(--white); --pat: repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 14px); }
  .c2 { background: var(--mint); color: var(--forest); --pat: linear-gradient(var(--forest) 1px, transparent 1px), linear-gradient(90deg, var(--forest) 1px, transparent 1px); }
  .c3 { background: var(--peach); color: #9a3412; --pat: radial-gradient(circle at 50% 120%, transparent 30%, #9a3412 31% 33%, transparent 34%); }
  .c0::after { background-size: 16px 16px; }
  .c2::after { background-size: 22px 22px; }
  .c3::after { background-size: 40px 40px; }

  .info { padding: 16px 4px 0; display: flex; flex-direction: column; flex: 1; }
  .info p { margin: 0 0 14px; color: var(--muted); font-size: .95rem; flex: 1; }
  .info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .meta { font-size: .82rem; color: var(--muted); }
  .dl { display: inline-flex; align-items: center; gap: 7px; border: 0; cursor: pointer; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .88rem; transition: .2s; background: var(--forest); color: var(--white); }
  .dl:hover { background: var(--green); }
  .dl.locked { background: var(--peach); color: #9a3412; }
  .dl.locked:hover { background: var(--orange); color: var(--white); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px; }

  /* ---------- CTA band ---------- */
  .cta { margin: 100px 0 60px; background: var(--forest); color: var(--white); border-radius: 32px; padding: 64px 40px; text-align: center; position: relative; overflow: hidden; }
  .cta::before, .cta::after { content: ""; position: absolute; border-radius: 50%; }
  .cta::before { width: 260px; height: 260px; background: var(--orange); left: -90px; bottom: -120px; }
  .cta::after { width: 180px; height: 180px; border: 28px solid var(--green); right: -50px; top: -60px; }
  .cta h2 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; position: relative; z-index: 1; }
  .cta h2 em { color: var(--orange); }
  .cta p { opacity: .8; margin: 14px auto 30px; max-width: 44ch; position: relative; z-index: 1; }
  .cta .btn { position: relative; z-index: 1; }

  footer { padding: 30px 0 40px; color: var(--muted); font-size: .88rem; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1.5px solid var(--line); }
  footer strong { color: var(--forest); }

  /* ---------- Ticket modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15,77,50,.55); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.open { display: flex; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } }
  .ticket { display: grid; grid-template-columns: 200px 1fr; width: 100%; max-width: 730px; max-height: 100%; overflow-y: auto; border-radius: 26px; background: var(--white); position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.3); animation: drop .55s cubic-bezier(.2,1.2,.3,1); }
  @keyframes drop { from { opacity: 0; transform: translateY(-40px) rotate(-3deg); } }
  .stub { background: var(--orange); color: var(--white); padding: 28px 22px; display: flex; flex-direction: column; justify-content: space-between; position: relative; border-right: 3px dashed rgba(255,255,255,.6); }
  .stub::before, .stub::after { content: ""; position: absolute; right: -16px; width: 30px; height: 30px; border-radius: 50%; background: rgba(15,77,50,.55); }
  .stub::before { top: -15px; } .stub::after { bottom: -15px; }
  .stub small { font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; opacity: .85; }
  .stub .big { font: 800 1.95rem/0.95 var(--display); margin: 8px 0; }
  .stub .admit { font-family: var(--serif); font-style: italic; font-size: 1.3rem; }
  .stub .yo { font: 800 1rem var(--display); letter-spacing: .04em; margin-bottom: 10px; opacity: .95; }
  .barcode { height: 46px; background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 4px, #fff 4px 7px, transparent 7px 9px, #fff 9px 10px, transparent 10px 14px); opacity: .9; border-radius: 2px; }
  .ticket-body { padding: 34px 34px 30px; position: relative; }
  .ticket-top { display: flex; justify-content: space-between; align-items: center; margin: -12px -10px 14px 0; }
  .close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); font-size: 1.3rem; cursor: pointer; line-height: 1; }
  .close:hover { background: var(--mint); }
  .ticket h2 { font-size: 2rem; font-weight: 800; color: var(--forest); }
  .ticket h2 em { color: var(--orange); }
  .ticket .sub { color: var(--muted); margin: 8px 0 22px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; color: var(--forest); }
  .field input { width: 100%; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); font: 1rem var(--body); transition: .2s; }
  .field input:focus { outline: 0; border-color: var(--green); background: var(--white); box-shadow: 0 0 0 4px var(--mint); }
  .roles { display: flex; gap: 8px; flex-wrap: wrap; }
  .roles input { position: absolute; opacity: 0; pointer-events: none; }
  .roles span { display: inline-block; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); font-size: .85rem; font-weight: 500; color: var(--ink); cursor: pointer; transition: .2s; }
  .roles input:checked + span { background: var(--forest); border-color: var(--forest); color: var(--white); }
  .roles input:focus-visible + span { box-shadow: 0 0 0 4px var(--mint); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .84rem; color: var(--muted); margin: 6px 0 18px; cursor: pointer; }
  .check input { accent-color: var(--green); width: 17px; height: 17px; margin-top: 2px; flex-shrink: 0; }
  .error { color: #dc2626; font-size: .86rem; min-height: 1.2em; margin: 0 0 8px; }
  .ticket .btn { width: 100%; }
  .hp { position: absolute; left: -9999px; }
  .success { display: none; text-align: center; padding: 20px 0 6px; }
  .ticket.done .form-view { display: none; }
  .ticket.done .success { display: block; }
  .stamp { width: 110px; height: 110px; margin: 0 auto 18px; border-radius: 50%; border: 4px solid var(--green); color: var(--green); display: grid; place-items: center; text-align: center; font: 800 .95rem/1.05 var(--display); text-transform: uppercase; transform: rotate(-12deg); animation: stamp .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } }
  .success .btn + .btn { margin-top: 10px; }

  /* confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall var(--t) cubic-bezier(.3,.6,.5,1) forwards; }
  @keyframes fall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 140px); background: var(--forest); color: var(--white); padding: 13px 22px; border-radius: 999px; font-weight: 500; z-index: 60; transition: transform .35s cubic-bezier(.2,1.2,.3,1), opacity .35s; max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center; opacity: 0; visibility: hidden; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding-top: 20px; }
    .stack { height: 360px; max-width: 460px; width: 100%; margin: 0 auto; }
    .stack .book-mini { width: 170px; height: 230px; padding: 18px; }
    .stack .book-mini h3 { font-size: 1.2rem; }
    .steps { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .brand-name small { display: none; }
    .brand-mark { width: 38px; height: 38px; font-size: .92rem; }
    .brand-name { font-size: .9rem; max-width: 7ch; }
    .nav-right { gap: 6px; }
    .lang button { padding: 5px 8px; }
    .pass-btn { padding: 8px 12px; font-size: .78rem; }
    .ticket { grid-template-columns: 1fr; }
    .stub { flex-direction: row; align-items: center; border-right: 0; border-bottom: 3px dashed rgba(255,255,255,.6); padding: 18px 22px; }
    .stub::before, .stub::after { display: none; }
    .stub .big { font-size: 1.4rem; margin: 2px 0; }
    .stub .yo { display: none; }
    .barcode { width: 70px; height: 40px; }
    .ticket-body { padding: 26px 20px; }
    .cta { padding: 48px 22px; }
    .cta::before { width: 140px; height: 140px; left: -70px; bottom: -80px; }
    .cta::after { width: 110px; height: 110px; border-width: 18px; right: -45px; top: -45px; }
    .search input { width: 120px; }
    .stack .b1 { left: 2%; } .stack .b3 { left: 46%; }
    .sticker { width: 96px; height: 96px; } .sticker-core { right: calc(2% + 28px); top: 28px; width: 40px; height: 40px; font-size: .8rem; }
    .shelf { grid-template-columns: repeat(2, 1fr); gap: 22px 14px; }
    .cover { padding: 14px 12px 12px 20px; aspect-ratio: 4 / 5; }
    .cover::before { width: 8px; }
    .cover .top { font-size: .6rem; letter-spacing: .06em; }
    .cover .top > span:first-child { display: none; }
    .cover h3 { font-size: 1.1rem; }
    .cover .no { font-size: .9rem; margin-top: 4px; }
    .lock { width: 34px; height: 34px; right: 10px; bottom: 10px; }
    .lock svg { width: 15px; height: 15px; }
    .info p { font-size: .85rem; }
    .info-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .dl { width: 100%; justify-content: center; padding: 9px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

/* ===================== No need to edit below ===================== */
const STORAGE_KEY = "library_user";
const LANG_KEY = "library_lang";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safe = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let user = null;
try { user = JSON.parse(safe.get(STORAGE_KEY)); } catch {}
if (user && !user.pass) { user.pass = String(Math.floor(1000 + Math.random() * 9000)); safe.set(STORAGE_KEY, JSON.stringify(user)); }

let lang = safe.get(LANG_KEY) || ((navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en");
if (!I18N[lang]) lang = "en";

/* ---------- Tracking (anonymous visitor ID + where people come from) ---------- */
const VISITOR_KEY = "library_vid";
const SOURCE_KEY = "library_src";
const isReturning = !!safe.get(VISITOR_KEY);
const visitorId = safe.get(VISITOR_KEY) || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
safe.set(VISITOR_KEY, visitorId);

function deviceInfo() {
  const ua = navigator.userAgent;
  const iPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  const device = iPadOS || /iPad|Tablet|Android(?!.*Mobile)/i.test(ua) ? "Tablet" : /Mobi|iPhone|iPod|Android/i.test(ua) ? "Mobile" : "Desktop";
  const browser = /Edg\//.test(ua) ? "Edge" : /OPR\/|Opera/.test(ua) ? "Opera" : /SamsungBrowser/.test(ua) ? "Samsung Internet"
    : /Instagram/.test(ua) ? "Instagram app" : /FBAN|FBAV/.test(ua) ? "Facebook app" : /TikTok|musical_ly/i.test(ua) ? "TikTok app"
    : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Other";
  const os = /Windows/.test(ua) ? "Windows" : (iPadOS || /iPhone|iPad|iPod/.test(ua)) ? "iOS" : /Android/.test(ua) ? "Android"
    : /CrOS/.test(ua) ? "ChromeOS" : /Mac OS X/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "Other";
  return { device, browser, os };
}

/* Remembers where the visitor first came from (UTM link, other website, or direct) */
function trafficSource() {
  let src = null;
  try { src = JSON.parse(safe.get(SOURCE_KEY)); } catch {}
  const u = new URLSearchParams(location.search);
  if (!src || u.get("utm_source")) {
    let ref = "";
    try { ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, "") : ""; } catch {}
    if (ref && ref === location.hostname.replace(/^www\./, "")) ref = "";
    src = {
      source: u.get("utm_source") || ref || "direct",
      medium: u.get("utm_medium") || (ref ? "referral" : "none"),
      campaign: u.get("utm_campaign") || "",
      referrer: document.referrer || "",
      landing: location.href
    };
    safe.set(SOURCE_KEY, JSON.stringify(src));
  }
  return src;
}

function ctx() {
  const d = deviceInfo(), s = trafficSource();
  let region = "", timezone = "";
  try { region = new Intl.Locale(navigator.language).region || ""; } catch {}
  try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch {}
  return {
    visitorId, lang, device: d.device, browser: d.browser, os: d.os, timezone, region,
    source: s.source, medium: s.medium, campaign: s.campaign, referrer: s.referrer, landing: s.landing,
    screen: `${screen.width}x${screen.height}`, page: location.href
  };
}

function trackVisit() {
  if (SCRIPT_URL.startsWith("PASTE")) return;
  try { if (sessionStorage.getItem("library_visit")) return; sessionStorage.setItem("library_visit", "1"); } catch {}
  send({ action: "visit", returning: isReturning ? "yes" : "no", signedUp: user ? "yes" : "no", ...ctx() });
}

let query = "";

const t = (key, vars = {}) => (I18N[lang][key] ?? I18N.en[key] ?? key).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");

const coverOf = (g, i) => "c" + (g.cover ?? i % 4);
const firstName = () => user ? user.name.split(" ")[0] : "";

function send(payload) {
  return fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(payload) });
}
function toast(html) {
  const el = $("toast"); el.innerHTML = html; el.classList.add("show");
  clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("show"), 3200);
}

function applyStatic() {
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml, { sq: SQUIGGLE }));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); el.setAttribute("aria-label", t(el.dataset.i18nPh)); });
  document.querySelectorAll(".lang button").forEach(b => { b.classList.toggle("on", b.dataset.lang === lang); b.setAttribute("aria-pressed", b.dataset.lang === lang); });
  $("stickerText").textContent = t("sticker");
}

function renderStack() {
  $("stack").querySelectorAll(".book-mini").forEach(n => n.remove());
  const html = GUIDES.slice(0, 3).map((g, i) => `
    <div class="book-mini b${i + 1} ${coverOf(g, i)}">

      <h3>${esc(gTitle(g))}</h3>
      <small>${esc(g.type)} · ${esc(t("free"))}</small>
    </div>`).join("");
  $("stack").insertAdjacentHTML("beforeend", html);
}

function renderChips() {
  const cats = ["All", ...new Set(GUIDES.map(g => g.category))];
  $("chips").innerHTML = cats.map(c => `<button class="chip ${c === activeCat ? "active" : ""}" data-cat="${esc(c)}">${esc(catName(c))}</button>`).join("");
}

function renderShelf() {
  const q = query.toLowerCase();
  const list = GUIDES.map((g, i) => ({ g, i })).filter(({ g }) =>
    (activeCat === "All" || g.category === activeCat) &&
    (!q || [g.title, g.title_es, g.desc, g.desc_es, g.category, CATEGORY_ES[g.category]].join(" ").toLowerCase().includes(q)));
  $("shelf").innerHTML = list.length ? list.map(({ g, i }, k) => `
    <article class="book" style="animation-delay:${k * 60}ms">
      <div class="cover ${coverOf(g, i)}" data-id="${esc(g.id)}" role="button" tabindex="0" aria-label="${esc(gTitle(g))}">
        <div class="top"><span>${esc(catName(g.category))}</span><span class="type">${esc(g.type)}</span></div>
        <h3>${esc(gTitle(g))}</h3>
        <span class="no">${t("vol")} ${String(i + 1).padStart(2, "0")}</span>
        ${user ? "" : `<span class="lock" style="--d:${k * 90}ms">${ICON.lock}</span>`}
      </div>
      <div class="info">
        <p>${esc(gDesc(g))}</p>
        <div class="info-row">
          <span class="meta">${esc(g.type)} · ${esc(g.size)}</span>
          <button class="dl ${user ? "" : "locked"}" data-id="${esc(g.id)}">${user ? ICON.dl + esc(t("download")) : ICON.lock.replace(/20/g, "15") + esc(t("unlock"))}</button>
        </div>
      </div>
    </article>`).join("") : `<p class="empty">${esc(t("empty", { q: query }))}</p>`;
}

function renderModalText() {
  $("modalSub").textContent = pendingGuide ? t("modalSubGuide", { title: gTitle(pendingGuide) }) : t("modalSub");
  $("welcome").innerHTML = t("welcome", { name: esc(firstName()) });
  const sd = $("successDownload");
  if (pendingGuide) { sd.style.display = ""; sd.innerHTML = ICON.dl + esc(t("downloadThis", { title: gTitle(pendingGuide) })); }
  else sd.style.display = "none";
}

function renderAll() {
  applyStatic(); renderNav(); renderStack(); renderMarquee(); renderChips(); renderShelf(); renderModalText();
}

function setLang(l) {
  if (!I18N[l] || l === lang) return;
  lang = l; safe.set(LANG_KEY, l);
  $("formError").textContent = "";
  renderAll();
}

function countUp(el, to) {
  let n = 0; const step = Math.max(1, Math.ceil(to / 20));
  const timer = setInterval(() => { n = Math.min(to, n + step); el.textContent = n; if (n >= to) clearInterval(timer); }, 40);
}

/* ---------- Modal ---------- */
function openModal(guide) {
  if (user) return;
  pendingGuide = guide || null;
  $("ticket").classList.remove("done");
  $("formError").textContent = "";
  renderModalText();
  $("overlay").classList.add("open");
  setTimeout(() => $("name").focus(), 80);
}
function closeModal() { $("overlay").classList.remove("open"); }

function confetti() {
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#ff6a1a", "#1f9d55", "#0f4d32", "#ffe6d3", "#dcf5e6"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--x", (Math.random() * 200 - 100) + "px");
    p.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
    p.style.setProperty("--t", (1.6 + Math.random() * 1.6) + "s");
    p.style.animationDelay = Math.random() * .4 + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4000);
}

function unlockShelf() {
  $("shelf").classList.add("unlocking");
  setTimeout(() => { $("shelf").classList.remove("unlocking"); renderShelf(); }, 900);
}

function download(g) {
  const file = gFile(g);
  if (!SCRIPT_URL.startsWith("PASTE")) send({ action: "download", email: user.email, name: user.name, guideId: g.id, guideTitle: g.title, ...ctx() });
  const a = document.createElement("a");
  a.href = file; a.target = "_blank"; a.rel = "noopener";
  if (!/^https?:/i.test(file)) a.download = "";
  document.body.appendChild(a); a.click(); a.remove();
  toast(ICON.dl + esc(t("downloading", { title: gTitle(g) })));
}

$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const email = f.email.value.trim().toLowerCase();
  if (f.website.value) return;
  if (name.length < 2) return ($("formError").textContent = t("errName"));
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return ($("formError").textContent = t("errEmail"));
  if (SCRIPT_URL.startsWith("PASTE")) return ($("formError").textContent = t("errSetup"));

  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = t("submitting");
  try {
    const role = (f.querySelector("input[name=role]:checked") || {}).value || "";
    await send({
      action: "signup", name, email, role, consent: f.consent.checked ? "yes" : "no",
      guideId: pendingGuide ? pendingGuide.id : "", guideTitle: pendingGuide ? pendingGuide.title : "",
      userAgent: navigator.userAgent, ...ctx()
    });
    user = { name, email, pass: String(Math.floor(1000 + Math.random() * 9000)) };
    safe.set(STORAGE_KEY, JSON.stringify(user));
    renderModalText();
    $("ticket").classList.add("done");
    renderNav(); confetti(); unlockShelf(); f.reset();
  } catch {
    $("formError").textContent = t("errNet");
  } finally {
    btn.disabled = false; btn.textContent = t("submit");
  }
});

/* ---------- Events ---------- */
function handleGuide(id) {
  const g = GUIDES.find(x => x.id === id); if (!g) return;
  user ? download(g) : openModal(g);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("shelf").addEventListener("click", (e) => {
  const el = e.target.closest("[data-id]"); if (el) handleGuide(el.dataset.id);
});
$("shelf").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".cover")) { e.preventDefault(); handleGuide(e.target.dataset.id); }
});
$("chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  activeCat = c.dataset.cat; renderChips(); renderShelf();
});
$("search").addEventListener("input", (e) => { query = e.target.value.trim(); renderShelf(); });
const goOrOpen = () => user ? $("library").scrollIntoView({ behavior: "smooth" }) : openModal();
$("heroCta").addEventListener("click", goOrOpen);
$("ctaBtn").addEventListener("click", goOrOpen);
$("passBtn").addEventListener("click", () => {
  if (!user) return openModal();
  if (confirm(t("signOut"))) { safe.del(STORAGE_KEY); user = null; renderNav(); renderShelf(); }
});
$("successDownload").addEventListener("click", () => { if (pendingGuide) download(pendingGuide); closeModal(); });
$("successBrowse").addEventListener("click", () => { closeModal(); $("library").scrollIntoView({ behavior: "smooth" }); });
$("closeModal").addEventListener("click", closeModal);
$("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* ---------- Init ---------- */
$("year").textContent = new Date().getFullYear();
renderAll();
countUp($("statCount"), GUIDES.length);
countUp($("statCats"), new Set(GUIDES.map(g => g.category)).size);
trackVisit();
if (!user && AUTO_OPEN_DELAY >= 0) setTimeout(() => openModal(), AUTO_OPEN_DELAY);
</script>
</body>
</html>
